services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: freegent
      POSTGRES_USER: freegent
      POSTGRES_PASSWORD: ${FREEGENT_POSTGRES_PASSWORD:-freegent}
    volumes:
      - freegent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freegent -d freegent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: ghcr.io/simonbalfe/freegent-api:${FREEGENT_IMAGE_TAG:-latest}
    build:
      context: .
      target: api
    ports:
      - "${FREEGENT_LISTEN_HOST:-127.0.0.1}:${FREEGENT_PORT:-8080}:8080"
    environment:
      FREEGENT_DATABASE_URL: postgres://freegent:${FREEGENT_POSTGRES_PASSWORD:-freegent}@postgres:5432/freegent?sslmode=disable
      FREEGENT_DATABASE_MAX_CONNS: ${FREEGENT_DATABASE_MAX_CONNS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/simonbalfe/freegent-api:${FREEGENT_IMAGE_TAG:-latest}
    build:
      context: .
      target: api
    stop_grace_period: 40s
    healthcheck:
      disable: true
    command:
      - worker
      - -concurrency
      - ${FREEGENT_WORKER_CONCURRENCY:-50}
      - -timeout
      - ${FREEGENT_OPERATION_TIMEOUT:-15m}
    environment:
      FREEGENT_DATABASE_URL: postgres://freegent:${FREEGENT_POSTGRES_PASSWORD:-freegent}@postgres:5432/freegent?sslmode=disable
      FREEGENT_DATABASE_MAX_CONNS: ${FREEGENT_DATABASE_MAX_CONNS:-30}
      FREEGENT_MODEL_PROVIDER: ${FREEGENT_MODEL_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      FREEGENT_CODEX_AUTH_FILE: /var/lib/freegent-auth/codex-auth.json
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      PAGELODE_URL: ${PAGELODE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - freegent_codex_auth:/var/lib/freegent-auth
    depends_on:
      api:
        condition: service_healthy
volumes:
  freegent_postgres:
  freegent_codex_auth:
