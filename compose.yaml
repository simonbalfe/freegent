services:
  api:
    build:
      context: .
    ports:
      - "127.0.0.1:${OPENCLAYGENT_PORT:-8080}:8080"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      OPENEXTRACT_URL: http://openextract:8081
      OPENCLAY_LOG_DIR: /data/logs
    volumes:
      - openclaygent_logs:/data/logs
    depends_on:
      openextract:
        condition: service_healthy
    restart: unless-stopped

  openextract:
    build:
      context: ./services/openextract
    ports:
      - "127.0.0.1:${OPENEXTRACT_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EVOMI_USERNAME: ${EVOMI_USERNAME:-}
      EVOMI_PASSWORD: ${EVOMI_PASSWORD:-}
      EVOMI_GATEWAY: ${EVOMI_GATEWAY:-}
      CAPSOLVER_API_KEY: ${CAPSOLVER_API_KEY:-}
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:-}
    init: true
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

volumes:
  openclaygent_logs:
